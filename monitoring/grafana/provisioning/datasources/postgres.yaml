apiVersion: 1

datasources:
  - name: IRB Postgres
    uid: irb_postgres
    type: postgres
    access: proxy
    # Reaches the postgres compose service; credentials come from the grafana
    # container's env (set to the POSTGRES_* values in docker-compose.yml).
    url: postgres:5432
    user: $POSTGRES_USER
    database: $POSTGRES_DB
    isDefault: true
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    editable: true
