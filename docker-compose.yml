# Infrastructure for IRB Copilot (SPEC §13).
#
# Five services: qdrant + postgres + grafana (state) and api + ui (application).
#   `make up`     — backing services only, for running the app from the host
#                   (the reranker then uses the local GPU; the image is CPU-only)
#   `make up-all` — everything in containers
# A production overlay adding Caddy lives in deploy/; see deploy/README.md.
#
# Ports and credentials are driven by `.env` (see `.env.example`) with sane
# defaults so `docker compose up` works out of the box.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_HOST:-0.0.0.0}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Probe real HTTP readiness, not just that the binary exists (`--version`
      # succeeds before Qdrant binds its port, so api could start too early).
      # The image has no curl/wget/nc but does ship bash, so use bash /dev/tcp:
      # a refused connection (port not yet up) or a non-200 fails the check.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-irb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irb}
      POSTGRES_DB: ${POSTGRES_DB:-irb}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Create the monitoring tables on first DB init (also done by monitoring.db).
      - ./monitoring/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-irb} -d ${POSTGRES_DB:-irb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Consumed by the provisioned Postgres datasource (postgres.yaml).
      POSTGRES_USER: ${POSTGRES_USER:-irb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irb}
      POSTGRES_DB: ${POSTGRES_DB:-irb}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provisioned Postgres datasource + monitoring dashboard.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  api:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Point at the compose service names (override .env localhost values).
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-irb}:${POSTGRES_PASSWORD:-irb}@postgres:5432/${POSTGRES_DB:-irb}
    volumes:
      # Share the corpus/index between host, api, ui, and `exec … ingestion`.
      - ./data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:${UI_PORT:-8501}:8501"
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0

volumes:
  qdrant_storage:
  postgres_data:
  grafana_data:
